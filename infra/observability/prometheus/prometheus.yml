global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: skull-api
    honor_labels: true
    static_configs:
      - targets: [host.docker.internal:9464]
        labels:
          service_name: skull-api
          environment: development
  - job_name: skull-api-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://host.docker.internal:3001/health/ready]
        labels:
          service_name: skull-api
          environment: development
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: skull-loki
    static_configs:
      - targets: [loki:3100]
        labels:
          environment: development
  - job_name: skull-alloy
    static_configs:
      - targets: [alloy:12345]
        labels:
          environment: development
  - job_name: skull-blackbox
    static_configs:
      - targets: [blackbox:9115]
        labels:
          environment: development
