name: Validate template archives

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm template:check
      - id: profiles
        run: echo "matrix=$(node scripts/template-profiles.mjs)" >> "$GITHUB_OUTPUT"

  language-profile:
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    env:
      PROFILE_ID: ${{ matrix.id }}
      PROFILE_LOCALES: ${{ matrix.locales }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install template tooling
        run: pnpm install --frozen-lockfile
      - name: Generate source ZIP
        run: node scripts/template-archives.mjs --profile "$PROFILE_ID" --output output/templates
      - name: Extract the ZIP for validation
        run: python3 -m zipfile --extract "output/templates/webapp-template-$PROFILE_ID.zip" "output/validate-$PROFILE_ID"
      - name: Cache extracted project dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: output/validate-${{ matrix.id }}/.node-version
          cache: pnpm
          cache-dependency-path: output/validate-${{ matrix.id }}/pnpm-lock.yaml
      - name: Validate the extracted project
        working-directory: output/validate-${{ matrix.id }}
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm --filter @workspace/api exec playwright install --with-deps chromium
          pnpm test:integration
          IFS=',' read -ra locales <<< "$PROFILE_LOCALES"
          for locale in "${locales[@]}"; do
            AUTH_TEST_LOCALE="$locale" pnpm test:e2e
          done

      - name: Upload failed profile diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-${{ matrix.id }}-e2e-diagnostics
          path: output/validate-${{ matrix.id }}/output/playwright/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload source ZIP without an outer archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: output/templates/webapp-template-${{ matrix.id }}.zip
          archive: false
          if-no-files-found: error
