name: Template distributions

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm template:check
      - id: profiles
        run: echo "matrix=$(node scripts/template-profiles.mjs)" >> "$GITHUB_OUTPUT"

  language-profile:
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    env:
      PROFILE_ID: ${{ matrix.id }}
      PROFILE_LOCALES: ${{ matrix.locales }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install template tooling
        run: pnpm install --frozen-lockfile
      - name: Generate source ZIP
        run: node scripts/template-archives.mjs --profile "$PROFILE_ID" --output output/templates
      - name: Extract the ZIP for validation
        run: python3 -m zipfile --extract "output/templates/webapp-skull-$PROFILE_ID.zip" "output/validate-$PROFILE_ID"
      - name: Validate the extracted project
        working-directory: output/validate-${{ matrix.id }}
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm --filter @workspace/api exec playwright install --with-deps chromium
          pnpm test:integration
          IFS=',' read -ra locales <<< "$PROFILE_LOCALES"
          for locale in "${locales[@]}"; do
            AUTH_TEST_LOCALE="$locale" pnpm test:e2e
          done

      - name: Upload source ZIP without an outer archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: output/templates/webapp-skull-${{ matrix.id }}.zip
          archive: false
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: language-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: webapp-skull-*.zip
          path: release
          merge-multiple: true
      - name: Publish the three validated templates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(release/webapp-skull-*.zip)
          test "${#assets[@]}" -eq 3
          for asset in "${assets[@]}"; do
            test -s "$asset"
            python3 -c 'import sys, zipfile; assert zipfile.ZipFile(sys.argv[1]).testzip() is None' "$asset"
          done
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
