name: Template distributions

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  language-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        locale: [en, fr]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install template tooling
        run: pnpm install --frozen-lockfile
      - name: Generate selected profile
        run: node scripts/template-create.mjs --locales "${{ matrix.locale }}" --docs-locale "${{ matrix.locale }}" --output "output/profile-${{ matrix.locale }}"
      - name: Validate generated project
        working-directory: output/profile-${{ matrix.locale }}
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm --filter @workspace/api exec playwright install --with-deps chromium
          pnpm test:integration
          pnpm test:e2e
      - name: Create source archive
        run: |
          tar --exclude=node_modules --exclude=dist --exclude=.turbo --exclude=.tanstack --exclude=generated --exclude=output --exclude='*.tsbuildinfo' --exclude=cache -czf "output/webapp-skull-${{ matrix.locale }}.tar.gz" -C "output/profile-${{ matrix.locale }}" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp-skull-${{ matrix.locale }}
          path: output/webapp-skull-${{ matrix.locale }}.tar.gz
          if-no-files-found: error
