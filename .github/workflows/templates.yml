name: Template distributions

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm template:check
      - id: profiles
        run: echo "matrix=$(node scripts/template-profiles.mjs)" >> "$GITHUB_OUTPUT"

  language-profile:
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    env:
      PROFILE_ID: ${{ matrix.id }}
      PROFILE_LOCALES: ${{ matrix.locales }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install template tooling
        run: pnpm install --frozen-lockfile
      - name: Generate selected profile
        run: node scripts/template-create.mjs --profile "$PROFILE_ID" --output "output/profile-$PROFILE_ID"
      - name: Validate generated project
        working-directory: output/profile-${{ matrix.id }}
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm --filter @workspace/api exec playwright install --with-deps chromium
          pnpm test:integration
          IFS=',' read -ra locales <<< "$PROFILE_LOCALES"
          for locale in "${locales[@]}"; do
            AUTH_TEST_LOCALE="$locale" pnpm test:e2e
          done
      - name: Create source archive
        run: |
          tar --exclude=node_modules --exclude=dist --exclude=.turbo --exclude=.tanstack --exclude=generated --exclude=output --exclude='*.tsbuildinfo' --exclude=cache -czf "output/webapp-skull-$PROFILE_ID.tar.gz" -C "output/profile-$PROFILE_ID" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp-skull-${{ matrix.id }}
          path: output/webapp-skull-${{ matrix.id }}.tar.gz
          if-no-files-found: error
